<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kasir POS & Manajemen Operasional Kuliner</title>

  <!-- Apple Web App & PWA Meta -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Kasir Kuliner">
  <meta name="theme-color" content="#F2F2F7">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            apple: {
              bg: '#F2F2F7',
              card: '#FFFFFF',
              blue: '#007AFF',
              green: '#34C759',
              orange: '#FF9500',
              red: '#FF3B30',
              indigo: '#5856D6'
            }
          }
        }
      }
    }
  </script>

  <!-- Application Styles -->
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-[#F2F2F7] text-[#1C1C1E] min-h-screen flex flex-col antialiased select-none pb-20 md:pb-6">

  <!-- Top Glassmorphism Navigation Bar (Desktop & iPad) -->
  <header class="sticky top-0 z-40 ios-glass border-b border-black/[0.08] px-4 lg:px-8 py-2.5">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <!-- App Brand & Title -->
      <div class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-blue-600 text-white flex items-center justify-center shadow-sm">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z"></path>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <path d="M16 10a4 4 0 0 1-8 0"></path>
          </svg>
        </div>
        <div>
          <div class="text-sm font-bold tracking-tight text-gray-900 leading-tight">Kasir & Kuliner POS</div>
          <div class="text-[10px] text-gray-500 font-medium">Sistem Kasir & Operasional Kuliner Modern</div>
        </div>
      </div>

      <!-- Desktop & Tablet Tab Navigation (Segmented Group) -->
      <nav class="hidden md:flex items-center gap-1.5 bg-[#E5E5EA] p-1 rounded-2xl" id="desktop-nav-tabs">
        <button class="ios-nav-tab px-3.5 py-2 rounded-xl font-semibold text-sm bg-white text-blue-600 shadow-xs border border-gray-200/80 flex items-center gap-2" data-tab="cashier">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
          <span>Kasir (POS)</span>
        </button>
        <button class="ios-nav-tab px-3.5 py-2 rounded-xl font-medium text-sm text-gray-500 hover:text-gray-900 hover:bg-black/[0.03] transition-all flex items-center gap-2" data-tab="menu">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
          <span>Menu & Resep HPP</span>
        </button>
        <button class="ios-nav-tab px-3.5 py-2 rounded-xl font-medium text-sm text-gray-500 hover:text-gray-900 hover:bg-black/[0.03] transition-all flex items-center gap-2" data-tab="inventory">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
          <span>Stok Bahan</span>
        </button>
        <button class="ios-nav-tab px-3.5 py-2 rounded-xl font-medium text-sm text-gray-500 hover:text-gray-900 hover:bg-black/[0.03] transition-all flex items-center gap-2" data-tab="reports">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
          <span>Laporan Penjualan</span>
        </button>
        <button class="ios-nav-tab px-3.5 py-2 rounded-xl font-medium text-sm text-gray-500 hover:text-gray-900 hover:bg-black/[0.03] transition-all flex items-center gap-2" data-tab="settings">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          <span>Pengaturan</span>
        </button>
      </nav>

      <!-- System Status Indicator & Sound Toggle -->
      <div class="flex items-center gap-2">
        <button id="btn-sound-toggle" class="flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-xs cursor-pointer select-none transition-all bg-blue-50 border-blue-200 text-blue-700" title="Klik untuk mengaktifkan atau membisukan suara klik kasir">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <span class="text-xs font-semibold">Suara Aktif</span>
        </button>

        <span class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 text-xs font-medium border border-emerald-200/60">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          <span class="hidden sm:inline">Lokal Browser</span>
        </span>
      </div>
    </div>
  </header>

  <!-- Main Content Container -->
  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">
    <div id="view-cashier" class="app-view"></div>
    <div id="view-menu" class="app-view hidden"></div>
    <div id="view-inventory" class="app-view hidden"></div>
    <div id="view-reports" class="app-view hidden"></div>
    <div id="view-settings" class="app-view hidden"></div>
  </main>

  <!-- Bottom Translucent Tab Bar (Mobile & Small Tablets) -->
  <nav class="md:hidden fixed bottom-0 left-0 right-0 z-40 ios-glass border-t border-black/[0.08] px-2 py-1 flex items-center justify-around" id="mobile-tab-bar">
    <button class="ios-bottom-tab" data-tab="cashier">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
      <span class="text-[10px] mt-0.5">Kasir</span>
    </button>
    <button class="ios-bottom-tab" data-tab="menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 8h1a4 4 0 0 1 0 8h-1"></path><path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path><line x1="6" y1="1" x2="6" y2="4"></line><line x1="10" y1="1" x2="10" y2="4"></line><line x1="14" y1="1" x2="14" y2="4"></line></svg>
      <span class="text-[10px] mt-0.5">Menu</span>
    </button>
    <button class="ios-bottom-tab" data-tab="inventory">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path><polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline><line x1="12" y1="22.08" x2="12" y2="12"></line></svg>
      <span class="text-[10px] mt-0.5">Stok</span>
    </button>
    <button class="ios-bottom-tab" data-tab="reports">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="20" x2="18" y2="10"></line><line x1="12" y1="20" x2="12" y2="4"></line><line x1="6" y1="20" x2="6" y2="14"></line></svg>
      <span class="text-[10px] mt-0.5">Laporan</span>
    </button>
    <button class="ios-bottom-tab" data-tab="settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
      <span class="text-[10px] mt-0.5">Setelan</span>
    </button>
  </nav>

  <!-- App Main Entry Point (Single Bundle for GitHub Pages + Modular Fallback) -->
  <script src="bundle.js" onerror="this.onerror=null;this.src='js/bundle.js'"></script>
  <script>
    // Fallback if bundle.js wasn't loaded
    if (!window.posApp) {
      const s = document.createElement('script');
      s.type = 'module';
      s.src = 'js/app.js';
      document.body.appendChild(s);
    }
  </script>
</body>
</html>
